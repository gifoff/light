[workspace]
resolver = "2"
members = [
    "crates/light",
    "crates/light-fw",
    "crates/light-core",
    "crates/light-element-form",
    "crates/light-behavior-validation",
    "crates/light-macros",
    "crates/light-html",
    "crates/light-demo",
    "crates/light-cli-core",
    "examples/counter",
    "examples/todo",
    "examples/calculator",
    "examples/dashboard",
    "examples/async-counter",
    "examples/multi-window",
    "examples/devtools-demo",
    "examples/plugin-demo",
    # --- 0.20.0: декомпозиция light-fw-core (этап 1, скелет) -------------
    # Пустые крейты-место будущего переноса слоёв из `light-fw-core`:
    # реактивность, VDOM/layout, окно (winit), CPU/GPU-рендер.
    "crates/light-reactivity",
    "crates/light-vdom",
    "crates/light-gui",
    "crates/light-render-cpu",
    "crates/light-render-gpu",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gifoff/light"
rust-version = "1.95"

[workspace.lints.cargo]
# light, light-render-cpu, light-render-gpu будут использованы на этапах 4+.
unused_workspace_dependencies = "allow"

[workspace.dependencies]
winit = "0.30"
pixels = "0.17"
softbuffer = "0.4"
ab_glyph = "0.2"
png = "0.17"
rfd = "0.14"
# 0.20.0 (этап 1): новый слой декомпозиции core.
# (`wgpu` сознательно не поднят: GPU-бэкенд идёт через `pixels`, как в
# light-fw-core, чтобы не дублировать версии wgpu в графе зависимостей.)
tiny-skia = "0.12"

light = { path = "crates/light", version = "0.19.0" }
light-fw = { path = "crates/light-fw", version = "0.19.0" }
light-fw-core = { path = "crates/light-core", version = "0.19.0" }
light-fw-element-form = { path = "crates/light-element-form", version = "0.19.0" }
light-fw-behavior-validation = { path = "crates/light-behavior-validation", version = "0.19.0" }
light-fw-macros = { path = "crates/light-macros", version = "0.19.0" }
light-fw-html = { path = "crates/light-html", version = "0.19.0" }
light-fw-cli-core = { path = "crates/light-cli-core", version = "0.19.0" }
light-fw-devtools-web = { path = "crates/light-devtools-web", version = "0.19.0" }
# 0.20.0 (этап 1): скелетные крейты декомпозиции `light-fw-core`.
# Пока пусты (перенос кода — этапы 2+); версии зафиксированы для стабильности.
light-reactivity = { path = "crates/light-reactivity", version = "0.20.0" }
light-vdom = { path = "crates/light-vdom", version = "0.20.0" }
light-gui = { path = "crates/light-gui", version = "0.20.0" }
light-render-cpu = { path = "crates/light-render-cpu", version = "0.20.0" }
light-render-gpu = { path = "crates/light-render-gpu", version = "0.20.0" }

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[profile.dev]
opt-level = 1
