[workspace]
resolver = "2"
members = [
    "crates/light",
    "crates/light-core",
    "crates/light-element-form",
    "crates/light-behavior-validation",
    "crates/light-macros",
    "crates/light-html",
    "crates/light-demo",
    "crates/light-cli-core",
    "crates/light-cli",
    "examples/counter",
    "examples/todo",
    "examples/calculator",
    "examples/dashboard",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gifoff/light"
rust-version = "1.95"

[workspace.dependencies]
winit = "0.30"
pixels = "0.17"
softbuffer = "0.4"
ab_glyph = "0.2"
png = "0.17"
rfd = "0.14"

light = { path = "crates/light", version = "0.10.1" }
light-fw-core = { path = "crates/light-core", version = "0.10.1" }
light-fw-element-form = { path = "crates/light-element-form", version = "0.10.1" }
light-fw-behavior-validation = { path = "crates/light-behavior-validation", version = "0.10.1" }
light-fw-macros = { path = "crates/light-macros", version = "0.10.1" }

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[profile.dev]
opt-level = 1
