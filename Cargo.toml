[workspace]
resolver = "2"
members = [
    "crates/relay",
    "crates/relay-core",
    "crates/relay-element-form",
    "crates/relay-behavior-validation",
    "crates/relay-macros",
    "crates/relay-html",
    "crates/relay-demo",
    "crates/relay-cli-core",
    "crates/relay-cli",
]
exclude = ["egui-main"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/relay-rs/relay"
rust-version = "1.95"

[workspace.dependencies]
winit = "0.30"
pixels = "0.17"
ab_glyph = "0.2"

relay = { path = "crates/relay", version = "0.3.0" }
relay-core = { path = "crates/relay-core", version = "0.3.0" }
relay-element-form = { path = "crates/relay-element-form", version = "0.3.0" }
relay-behavior-validation = { path = "crates/relay-behavior-validation", version = "0.3.0" }
relay-macros = { path = "crates/relay-macros", version = "0.3.0" }

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[profile.dev]
opt-level = 1
