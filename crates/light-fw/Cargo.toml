[package]
name = "light-fw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Реактивный графический интерфейс для Rust: Proxy-обозреватели и HTML-шаблоны в духе Vue 3"

[lib]
# Имя lib-крейта `light_fw`: генерируемый код макросов ссылается на
# `::light_fw::…` (см. `extern crate self as light_fw` в `src/lib.rs`).
name = "light_fw"

[dependencies]
light-fw-core = { workspace = true, default-features = false }
light-fw-element-form = { workspace = true, optional = true }
light-fw-behavior-validation = { workspace = true, optional = true }
# 0.20.0 (Этап 5): рендер-бэкенды. Прямые опциональные зависимости — фасад
# `light-fw::run` выбирает бэкенд по фиче сборки и строит фабрику для
# `light_gui::run_with_backend`. `light-fw-core` тянет их косвенно; прямые
# зависимости нужны, чтобы код фасада (`cfg` по фиче) ссылался на крейты явно.
light-render-cpu = { workspace = true, optional = true, default-features = false }
light-render-gpu = { workspace = true, optional = true, default-features = false }
# Сериализация конфигурации `light.config.json` для `run_with_config`.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Набор по умолчанию: базовые элементы + окно + показ через softbuffer + a11y.
default = ["elements-basic", "window", "softbuffer-backend", "a11y-winit"]

# --- Элементы разметки -------------------------------------------------
# `<div>`, `<span>`, `<h1>`–`<h5>`, `<titlebar>`, `<text>` и `<button>`.
elements-basic = ["light-fw-core/elements-basic"]
# Пароль (`<password>`), многострочное поле (`textarea`) и маркер изменения размера.
elements-input = ["light-fw-core/elements-input"]
# Флажок (`<checkbox>`).
elements-checkbox = ["light-fw-core/elements-checkbox"]
# Переключатель (`<radio>`).
elements-radio = ["light-fw-core/elements-radio"]
# Выпадающий список (`<select>`/`<option>`).
elements-select = ["light-fw-core/elements-select"]
# Компонент `light-fw-element-form`: флажок, переключатель и список.
elements-form = ["light-fw-core/elements-form", "dep:light-fw-element-form"]
# Маркер изменения размера текстового поля (`resize`).
resize-grip = ["light-fw-core/resize-grip"]

# --- Кросс-элементные возможности --------------------------------------
# Выравнивание содержимого контейнера (`align-items`/`justify-content`).
align-content = ["light-fw-core/align-content"]
# Порядок отрисовки и попадания (`z`).
z-order = ["light-fw-core/z-order"]
# Курсоры мыши (`cursor` и автоматический выбор по роли).
cursor-theming = ["light-fw-core/cursor-theming"]
# Смещение после выравнивания (`position-offset-x`/`position-offset-y`).
offset-position = ["light-fw-core/offset-position"]
# Динамические привязки `:attr`.
dynamic-attrs = ["light-fw-core/dynamic-attrs"]
# Обязательные поля (`required`/`required-indicator`) и стандартная проверка.
required-fields = ["light-fw-core/required-fields"]
# Компонент `light-fw-behavior-validation` (`:validator`/`@validate`).
validation = ["light-fw-core/validation", "dep:light-fw-behavior-validation"]
# Ограничения размера (`min-width`/`max-width`/`min-height`/`max-height`).
min-max-size = ["light-fw-core/min-max-size"]

# --- Изображения -------------------------------------------------------
# `<image>` и PNG-иконки окон.
image-support = ["light-fw-core/image-support"]
# Нативный диалог выбора файла.
file-dialog = ["light-fw-core/file-dialog"]

# --- Окно --------------------------------------------------------------
# Базовое окно на winit с программной отрисовкой.
window = ["light-fw-core/window"]
# Показ кадра через `softbuffer` (без wgpu/naga). По умолчанию включён.
# 0.20.0 (Этап 5): рендер-бэкенды вынесены из `light-gui` в отдельные крейты;
# фасад `light-fw::run` выбирает бэкенд по фиче и строит фабрику.
softbuffer-backend = [
    "light-fw-core/softbuffer-backend",
    "dep:light-render-cpu",
    "light-render-cpu/window",
]
# Показ кадра через `pixels` (wgpu/naga). Альтернативный бэкенд.
# Если включены обе фичи, используется `softbuffer-backend`.
wgpu-backend = [
    "light-fw-core/wgpu-backend",
    "dep:light-render-gpu",
    "light-render-gpu/window",
]
# Прозрачность окна (per-pixel alpha).
window-transparent = ["light-fw-core/window-transparent"]
# Модальные окна (`modal`).
window-modal = ["light-fw-core/window-modal"]
# Несколько окон (`open_window`).
window-multi = ["light-fw-core/window-multi"]
# Адресация окон по идентификатору (`open("id")`).
window-by-id = ["light-fw-core/window-by-id"]
# Изменение размера окна (`resizable`).
window-resize = ["light-fw-core/window-resize"]
# Фоновые задачи и доставка сообщений в UI-поток (`spawn`/`post_to_ui`).
async-runtime = ["light-fw-core/async-runtime"]
# Асинхронные замыкания (фьючи) через `futures::executor::block_on`.
async-await = ["light-fw-core/async-await"]

# --- Доступность -------------------------------------------------------
# Построение дерева доступности AccessKit.
a11y = ["light-fw-core/a11y"]
# Интеграция с `accesskit_winit` (включает полный набор подсистем a11y).
a11y-winit = ["light-fw-core/a11y-winit"]
# Живые регионы (`aria-live`).
a11y-live = ["light-fw-core/a11y-live"]
# Программный фокус и кольцо фокуса.
a11y-focus = ["light-fw-core/a11y-focus"]
# Клавиатурная навигация (`Tab`/`Enter`/`Space`/`Escape`).
a11y-keyboard = ["light-fw-core/a11y-keyboard"]

# --- Прочее ------------------------------------------------------------
# Включение шаблонов `<include src="...">`.
include = ["light-fw-core/include"]
# Runtime-шаблоны: `render()` читает HTML с диска при каждом вызове (dev).
runtime-templates = ["light-fw-core/runtime-templates"]
# Инспекция состояния: JSON-снимок VDOM и реактивных свойств (DevTools).
# Тянет `light-fw-core/devtools` (в который уже входит `async-runtime`)
# и явную `light-fw-core/async-runtime` для наглядности в `cargo tree`.
devtools = ["light-fw-core/devtools", "light-fw-core/async-runtime"]
# Отладочный режим: DevTools + асинхронная доставка команд в UI-поток.
# Используется алиасом `cargo dev` (`run --features light-fw/dev-mode`).
dev-mode = [
    "devtools",
    "async-runtime",
    "light-fw-core/runtime-templates",
]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
