[package]
name = "relay-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Процедурные макросы библиотеки Relay: #[proxy] и #[template]"

[lib]
proc-macro = true

[features]
# Сетка фич синхронизирована с `relay`: фичи включаются форвардом из relay
# (`relay` → `relay-macros/…`), чтобы `#[template]` знал, какие элементы и
# атрибуты доступны. Подробнее — `docs/DESIGN_PRINCIPLES.md`.
default = []
# Элементы разметки.
elements-basic = []
elements-input = []
elements-checkbox = []
elements-radio = []
elements-select = []
resize-grip = []
# Кросс-элементные возможности.
align-content = []
z-order = []
cursor-theming = []
offset-position = []
dynamic-attrs = []
required-fields = []
validation = []
min-max-size = []
# Прочее.
include = []
template-modal = []
template-window = []

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
relay-html = { path = "../relay-html", version = "0.3.0" }
