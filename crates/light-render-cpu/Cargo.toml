[package]
name = "light-render-cpu"
version = "0.20.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Light Render (CPU): программная отрисовка через tiny-skia + softbuffer (из light-fw-core)"

[dependencies]
# Окно/поверхность, в которую рисуем кадр.
light-gui = { workspace = true }
# Копирование кадра в native surface (без wgpu/naga).
softbuffer = { workspace = true }
# 2D-растровая отрисовка (прямые линии, текст, прямоугольники).
tiny-skia = { workspace = true }

[lints]
workspace = true
