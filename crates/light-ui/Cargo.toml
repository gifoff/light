[package]
name = "light-ui"
version = "0.21.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Light UI: готовые виджеты (Tooltip, Toast, Modal, Progress) поверх light-fw-core + light-gui (0.21.0)"

[lib]
name = "light_ui"

# Кастомные теги, разрешённые в HTML-шаблонах (ТЗ 0.19.0 Этап 4, Plugin API).
# Демо объявляет эти теги, чтобы `#[template]` генерировал `NodeKind::Custom`,
# а runtime доставлял их плагинной фабрике (distributed-slice в light-ui).
# `kind = "widget"` + `display-name` обязательны для парсинга `[package.metadata.light]`
# (иначе `light check`/`light dev` пропускают пакет и считают `<tooltip>` «неизвестным»).
[package.metadata.light]
kind = "widget"
display-name = "Light UI Widgets"
core = "^0.20"

[package.metadata.light.provides]
elements = ["tooltip", "toast-container"]

[features]
# Асинхронный рантайм (spawn/post_to_ui) — используется `show_toast` для
# автоскрытия через 3 секунды. В 0.21.0 включён по умолчанию: без него
# виджет Toast не может работать. Для headless-сборок можно отключить
# через `default-features = false` (тогда `show_toast` будет no-op).
default = ["async-runtime"]
async-runtime = ["light-fw-core/async-runtime"]

[dependencies]
# Базовый фреймворк: элементы/поведения/VDOM, на которых строятся виджеты.
# Фича `async-runtime` активизируется опционально через `[features]` выше.
light-fw-core = { workspace = true }
# Окно winit, события ввода и рендер-бэкенды — слой, над которым живут виджеты.
light-gui = { workspace = true }
# Регистрация кастомных элементов через distributed-slice (как в examples/plugin-demo).
linkme = "0.3"

[lints]
workspace = true
