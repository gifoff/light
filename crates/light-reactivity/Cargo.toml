[package]
name = "light-reactivity"
# Пока 0.20.0-скелет: версия закреплена в workspace-зависимости, а не
# наследуется от workspace.package (там 0.19.0 — общий bump будет отдельным
# коммитом перед релизом).
version = "0.20.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Light Reactivity: сигналы, реактивные свойства и обозреватели (из light-fw-core)"

[dependencies]
# Сериализация свойств и наблюдателей (для DevTools/inspector).
# Сейчас в `light-fw-core` уже есть эти зависимости; здесь дублируем, чтобы
# крейт был самодостаточным при последующих этапах декомпозиции.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
