[package]
name = "light"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Утилита light: проверка проекта и управление компонентами Light"

[[bin]]
name = "light"
path = "src/main.rs"
doc = false

[dependencies]
light-fw-cli-core = { path = "../light-cli-core", version = "0.16.3" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
dialoguer = { version = "0.11", default-features = false }
console = { version = "0.15", default-features = false }
indicatif = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
