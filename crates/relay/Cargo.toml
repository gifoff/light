[package]
name = "relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Реактивный графический интерфейс для Rust: Proxy-обозреватели и HTML-шаблоны в духе Vue 3"

[dependencies]
relay-core = { workspace = true, default-features = false }
relay-element-form = { workspace = true, optional = true }
relay-behavior-validation = { workspace = true, optional = true }

[features]
# Набор по умолчанию: базовые элементы + окно + показ через wgpu + a11y.
default = ["elements-basic", "window", "wgpu-backend", "a11y-winit"]

# --- Элементы разметки -------------------------------------------------
# `<div>`, `<span>`, `<h1>`–`<h5>`, `<titlebar>`, `<text>` и `<button>`.
elements-basic = ["relay-core/elements-basic"]
# Пароль (`<password>`), многострочное поле (`textarea`) и маркер изменения размера.
elements-input = ["relay-core/elements-input"]
# Флажок (`<checkbox>`).
elements-checkbox = ["relay-core/elements-checkbox"]
# Переключатель (`<radio>`).
elements-radio = ["relay-core/elements-radio"]
# Выпадающий список (`<select>`/`<option>`).
elements-select = ["relay-core/elements-select"]
# Компонент `relay-element-form`: флажок, переключатель и список.
elements-form = ["relay-core/elements-form", "dep:relay-element-form"]
# Маркер изменения размера текстового поля (`resize`).
resize-grip = ["relay-core/resize-grip"]

# --- Кросс-элементные возможности --------------------------------------
# Выравнивание содержимого контейнера (`align-items`/`justify-content`).
align-content = ["relay-core/align-content"]
# Порядок отрисовки и попадания (`z`).
z-order = ["relay-core/z-order"]
# Курсоры мыши (`cursor` и автоматический выбор по роли).
cursor-theming = ["relay-core/cursor-theming"]
# Смещение после выравнивания (`position-offset-x`/`position-offset-y`).
offset-position = ["relay-core/offset-position"]
# Динамические привязки `:attr`.
dynamic-attrs = ["relay-core/dynamic-attrs"]
# Обязательные поля (`required`/`required-indicator`) и стандартная проверка.
required-fields = ["relay-core/required-fields"]
# Компонент `relay-behavior-validation` (`:validator`/`@validate`).
validation = ["relay-core/validation", "dep:relay-behavior-validation"]
# Ограничения размера (`min-width`/`max-width`/`min-height`/`max-height`).
min-max-size = ["relay-core/min-max-size"]

# --- Окно --------------------------------------------------------------
# Базовое окно на winit с программной отрисовкой.
window = ["relay-core/window"]
# Показ кадра через `pixels` (wgpu/naga). По умолчанию включён.
wgpu-backend = ["relay-core/wgpu-backend"]
# Прозрачность окна (per-pixel alpha).
window-transparent = ["relay-core/window-transparent"]
# Модальные окна (`modal`).
window-modal = ["relay-core/window-modal"]
# Несколько окон (`open_window`).
window-multi = ["relay-core/window-multi"]
# Адресация окон по идентификатору (`open("id")`).
window-by-id = ["relay-core/window-by-id"]
# Изменение размера окна (`resizable`).
window-resize = ["relay-core/window-resize"]

# --- Доступность -------------------------------------------------------
# Построение дерева доступности AccessKit.
a11y = ["relay-core/a11y"]
# Интеграция с `accesskit_winit` (включает полный набор подсистем a11y).
a11y-winit = ["relay-core/a11y-winit"]
# Живые регионы (`aria-live`).
a11y-live = ["relay-core/a11y-live"]
# Программный фокус и кольцо фокуса.
a11y-focus = ["relay-core/a11y-focus"]
# Клавиатурная навигация (`Tab`/`Enter`/`Space`/`Escape`).
a11y-keyboard = ["relay-core/a11y-keyboard"]

# --- Прочее ------------------------------------------------------------
# Включение шаблонов `<include src="...">`.
include = ["relay-core/include"]

[dev-dependencies]
serde_json = "1"
