[package]
name = "light-vdom"
version = "0.20.1"
edition = "2024"
rust-version = "1.95"
description = "VDOM, layout, DOM tree and runtime for the Light UI framework (stage 3 of the light-fw-core decomposition)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/light-rs"
documentation = "https://docs.rs/light-vdom"
keywords = ["ui", "vdom", "wasm"]
categories = ["gui", "wasm"]

[lib]
name = "light_vdom"

[dependencies]
linkme = "0.3"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
light-reactivity = { workspace = true }
light-fw-html = { workspace = true }

# Оциональные зависимости (перенесены из light-fw-core в Этапе 3 — Strangler Fig).
# В light-fw-core они остаются как feature-зависимости до этапа 4.
png = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[features]
default = []
window = ["dep:winit"]
image-support = ["dep:png"]
async-runtime = []
runtime-templates = []
file-dialog = []
devtools = []
a11y = []
# Элементы разметки (управляют поведениями layout/validation/runtime).
elements-basic = []
elements-checkbox = []
elements-radio = []
elements-select = []

[lints]
workspace = true
