[package]
name = "light-vdom"
version = "0.20.2"
edition = "2024"
rust-version = "1.95"
description = "VDOM, layout, DOM tree and runtime for the Light UI framework (stage 3 of the light-fw-core decomposition)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/light-rs"
documentation = "https://docs.rs/light-vdom"
keywords = ["ui", "vdom", "wasm"]
categories = ["gui", "wasm"]

[lib]
name = "light_vdom"

[dependencies]
linkme = "0.3"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
light-reactivity = { workspace = true }
light-fw-html = { workspace = true }

# Опциональная зависимость (перенесена из light-fw-core в Этапе 3 — Strangler Fig):
# декодирование PNG для `<image>` и иконок. `winit` удалён (0.20.2 cleanup):
# окно живёт в `light-gui`; фича `window` ниже — только локальный канал
# `WindowCommand`/`WindowToken`, без оконных зависимостей.
png = { workspace = true, optional = true }

[features]
default = []
# Локальный channel окна (`WindowCommand`/`WindowToken` в `window_backend`);
# реальные окна/winit — в `light-gui`. Зависимостей внешних не тянет.
window = []
image-support = ["dep:png"]
async-runtime = []
runtime-templates = []
file-dialog = []
devtools = []
a11y = []
# Элементы разметки (управляют поведениями layout/validation/runtime).
elements-basic = []
elements-checkbox = []
elements-radio = []
elements-select = []

[lints]
workspace = true
