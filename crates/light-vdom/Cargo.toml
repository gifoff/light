[package]
name = "light-vdom"
version = "0.20.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Light VDOM: виртуальное дерево интерфейса, diff и раскладка (из light-fw-core)"

[dependencies]
# Reactivity — базовый слой; VDOM читает реактивные свойства при пересборке.
light-reactivity = { workspace = true }
# Парсер HTML — нужен для чтения шаблонов и сборки дерева узлов.
light-fw-html = { workspace = true }
