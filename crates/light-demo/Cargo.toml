[package]
name = "light-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Демонстрационное приложение библиотеки Light"

[dependencies]
# Базовый набор — элементы и окно. Компоненты и остальные возможности
# добавляются через фичи (см. `[features]`).
light-fw = { workspace = true, default-features = false, features = [
    "elements-basic",
    "window",
] }
# Компоненты подключаются явными зависимостями: так `light check` видит, что
# элементы формы и валидация установлены, а сборка без них не тянет их код.
light-fw-element-form = { workspace = true, optional = true }
light-fw-behavior-validation = { workspace = true, optional = true }

[features]
default = ["full"]
# DevTools: пробрасывает фичу в обёртку `light-fw`, чтобы сгенерированный
# код `#[template]` (`inspect_state`) нашёл `::light_fw::serde_json`.
devtools = ["light-fw/devtools"]
# Доступность (AccessKit) поверх окна.
a11y = ["light-fw/a11y-winit"]
# Показ кадра через softbuffer (без wgpu/naga).
softbuffer = ["light-fw/softbuffer-backend"]
# Показ кадра через pixels (wgpu/naga).
wgpu = ["light-fw/wgpu-backend"]
# Общий набор возможностей приложения без выбора бэкенда.
full-common = [
    "a11y",
    "dep:light-fw-element-form",
    "dep:light-fw-behavior-validation",
    "light-fw/align-content",
    "light-fw/z-order",
    "light-fw/cursor-theming",
    "light-fw/offset-position",
    "light-fw/dynamic-attrs",
    "light-fw/required-fields",
    "light-fw/min-max-size",
    "light-fw/include",
    "light-fw/window-transparent",
    "light-fw/window-modal",
    "light-fw/window-multi",
    "light-fw/window-by-id",
    "light-fw/window-resize",
]
# Полный набор возможностей с softbuffer (по умолчанию).
full = ["full-common", "softbuffer"]
# Полный набор возможностей с wgpu — для сравнения размера и производительности.
full-wgpu = ["full-common", "wgpu"]
# Минимальная сборка — базовые элементы, окно и softbuffer, без AccessKit и форм.
# Используется для замера размера бинарника (пример `minimal`).
minimal = ["softbuffer"]

[dev-dependencies]
serde_json = "1"
