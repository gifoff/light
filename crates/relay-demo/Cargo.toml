[package]
name = "relay-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Демонстрационное приложение библиотеки Relay"

[dependencies]
# Базовый набор — элементы и окно. Доступность и остальные возможности
# добавляются через фичи крейта (см. `[features]`).
relay = { workspace = true, default-features = false, features = [
    "elements-basic",
    "window",
] }

[features]
default = ["full"]
# Доступность (AccessKit) поверх окна.
a11y = ["relay/a11y-winit"]
# Полный набор возможностей, используемый основным демо-приложением.
full = [
    "a11y",
    "relay/elements-form",
    "relay/align-content",
    "relay/z-order",
    "relay/cursor-theming",
    "relay/offset-position",
    "relay/dynamic-attrs",
    "relay/required-fields",
    "relay/validation",
    "relay/min-max-size",
    "relay/include",
    "relay/window-transparent",
    "relay/window-modal",
    "relay/window-multi",
    "relay/window-by-id",
    "relay/window-resize",
]
# Минимальная сборка — базовые элементы и окно, без AccessKit и форм.
# Используется для замера размера бинарника (пример `minimal`).
minimal = []

[dev-dependencies]
serde_json = "1"
