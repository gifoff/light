[package]
name = "relay-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Демонстрационное приложение библиотеки Relay"

[dependencies]
# Базовая подсистема демо всегда включает окно и доступность; конкретные
# элементы и возможности добавляются через фичи крейта (см. `[features]`).
relay = { workspace = true, default-features = false, features = [
    "elements-basic",
    "window",
    "a11y-winit",
] }

[features]
default = ["full"]
# Полный набор возможностей, используемый основным демо-приложением.
full = [
    "relay/elements-form",
    "relay/align-content",
    "relay/z-order",
    "relay/cursor-theming",
    "relay/offset-position",
    "relay/dynamic-attrs",
    "relay/required-fields",
    "relay/validation",
    "relay/min-max-size",
    "relay/include",
    "relay/window-transparent",
    "relay/window-modal",
    "relay/window-multi",
    "relay/window-by-id",
    "relay/window-resize",
    "relay/a11y-live",
    "relay/a11y-focus",
    "relay/a11y-keyboard",
]
# Минимальная сборка — только базовые элементы, окно и a11y. Используется для
# замера размера бинарника (пример `minimal`).
minimal = []

[dev-dependencies]
serde_json = "1"
