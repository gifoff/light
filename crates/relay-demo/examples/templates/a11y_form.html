<window id="a11y-form" width="420" height="480" resizable="true">
    <titlebar background="#333333DD" border-color="#D5DAE3">
        <div font-size="20" font-color="#FFFFFF">Доступная форма</div>
        <div position-x="right" direction="horizontal">
            <button @click="Dom::window().map(|window| window.close())">X</button>
        </div>
    </titlebar>
    <div direction="vertical" padding="12" role="form" aria-label="Регистрация">
        <h1>Регистрация</h1>
        <text v-model="name" placeholder="Имя" aria-label="Имя" required />
        <text v-model="email" placeholder="Email" aria-label="Электронная почта" required />
        <checkbox v-model="agree" aria-label="Согласие с условиями">Согласен с условиями</checkbox>
        <button @click="submit" :disabled="blocked">Отправить</button>
        <div role="status" aria-live="polite">{{ message }}</div>
    </div>
</window>
