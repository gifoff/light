<window id="a11y-form" width="420" height="480" min-width="200" min-height="200" max-width="800" max-height="800" resizable="true">
    <titlebar width="100%" height="40" background="#333333" >
        <h3 width="100%" height="100%" justify-content="center" align-items="center" background="#c9938f">
            Доступная форма
        </h3>
        <button
                position-x="right" position-y="center"
                background="#9c9a32"
                padding="10"
                type="button" aria-label="Закрыть" tabindex="50" @click="Dom::window().map(|window| window.close())">x</button>
    </titlebar>
    <div direction="vertical" padding="12" role="form" aria-label="Регистрация">
        <h1>Регистрация</h1>
        <text tabindex="1" min-width="100" width="100%" v-model="name" placeholder="Имя" aria-label="Имя" required />
        <text tabindex="2" width="100%" v-model="email" placeholder="Email" aria-label="Электронная почта" required :validator="validate_email" />
        <checkbox tabindex="3" v-model="agree" aria-label="Согласие с условиями" required>Согласен с условиями</checkbox>
        <button tabindex="4" min-width="200" width="75%" @click="submit" :disabled="blocked">Отправить</button>
        <div font-size="12" font-color="#6B7280">Нажмите Enter в поле ввода, чтобы отправить форму</div>
        <div role="status" aria-live="polite">{{ message }}</div>
    </div>
</window>
