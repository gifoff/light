# Встроенный реестр компонентов Light.
#
# Stage 1 CLI: реестр — статическая таблица, встроенная в бинарник через
# `include_str!`. Позже она может дополняться каталогом (network registry),
# но базовый набор известных компонентов всегда доступен офлайн.
#
# Каждая запись описывает компонент (§3 модели компонентов) и то, какие
# теги, атрибуты и директивы он предоставляет. CLI использует это, чтобы
# по шаблонам проекта понять, какие компоненты нужны.
#
# Текст (`<text>`, `<password>`, `<textarea>`) входит в ядро `light-fw-core`
# и отдельного компонента не требует.

[[components]]
name = "light-fw-element-form"
kind = "element"
display-name = "Form elements"
version = "0.6.1"
core = "^0.6"
light-features = ["elements-form"]
elements = ["select", "checkbox", "radio", "option"]

[[components]]
name = "light-fw-behavior-validation"
kind = "behavior"
display-name = "Form validation"
version = "0.6.1"
core = "^0.6"
light-features = ["validation"]
attributes = [":validator", "required"]
directives = ["@validate"]
