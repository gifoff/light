[package]
name = "light-fw-cli-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Ядро CLI Light: анализ проекта, управление компонентами и light.lock"

[dependencies]
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
walkdir = "2"
ignore = "0.4"
thiserror = "2"
glob = "0.3"
light-fw-html = { path = "../light-html", version = "0.5.0" }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "blocking",
], optional = true }

[features]
default = []
# Сетевой доступ к crates.io (обёртка над `reqwest`). Выключен по умолчанию,
# чтобы `check`/`suggest`/`doctor` и тесты собирались без тяжёлых зависимостей.
network = ["dep:reqwest"]
