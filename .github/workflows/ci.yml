name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - name: Build book
        run: mdbook build

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Windows/MSVC: ring (через reqwest в light-fw-cli) упирается в лимит
      # командной строки D8050 при параллельной сборке.
      - name: Clippy
        env:
          CARGO_BUILD_JOBS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cargo test --all-features

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        env:
          # ring через reqwest в light-fw-cli: обход лимита D8050.
          CARGO_BUILD_JOBS: "1"
        run: cargo test --all-features -j 2

      - name: Compile benchmarks (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cargo bench --no-run

      - name: Compile benchmarks (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo bench --no-run -j 2

  # Регрессия 0.15.0: примеры не собирались без --all-features (cfg на
  # inspect_state/inject_state + скрытые реэкспорты). Эта сборка ловит
  # повторения: пользовательская зависимость light = "0.15" — это дефолтные
  # фичи, а не all-features.
  build-default:
    name: Build examples (default features)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace without --all-features
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo build --workspace
          cargo build -p example-counter
          cargo build -p example-dashboard
          cargo build -p example-multi-window
          cargo build -p example-devtools-demo

  # Feature combinations are checked separately on Linux: they catch code that
  # is valid only with `--all-features` but broken with a reduced feature set.
  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: basic-elements
            args: --no-default-features --features elements-basic
          - name: basic-window-a11y
            args: --no-default-features --features "elements-basic,window,a11y-winit"
          - name: form-window-a11y
            args: --no-default-features --features "elements-form,window,a11y-winit"
          - name: a11y-no-winit
            args: --no-default-features --features "elements-basic,window,a11y"
          - name: full
            args: >-
              --no-default-features
              --features "elements-form,window,a11y-winit,include,align-content,z-order,cursor-theming,offset-position,dynamic-attrs,required-fields,validation,min-max-size"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test feature set
        run: cargo test -p light ${{ matrix.args }}
