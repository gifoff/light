name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook (manual download)
        # peaceiris/actions-mdbook@v2 и прямые curl'ы из runners'ов периодически
        # получают 403 от github release-хоста (rate-limit на общий IP-пул).
        # Ключевое отличие от первого фикса: curl с `-f`, чтобы HTTP 4xx/5xx
        # не проглатывались как «успех» (из-за чего tar получал пустой файл);
        # увеличенные retry'ы (5 × 5с), проверка размера, диагностика при провале.
        run: |
          set -euo pipefail
          MDBOOK_VERSION="0.5.4"
          FILE="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${FILE}"
          mkdir -p "$HOME/.local/bin"
          # --retry 5: до 5 повторов, backoff 5c; -f: провалиться при HTTP >= 400
          if ! curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
               -o "/tmp/${FILE}" "$URL"; then
            echo "[error] mdbook download failed from $URL" >&2
            ls -la "/tmp/${FILE}" 2>/dev/null || true
            head -c 1024 "/tmp/${FILE}" 2>/dev/null | od -c | head -20 || true
            exit 1
          fi
          # sanity check: реальный бинарник ~7 MB; < 1MB = вероятно error page
          SIZE=$(stat -c%s "/tmp/${FILE}")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "[error] downloaded file too small ($SIZE bytes), likely HTML error page" >&2
            head -c 1024 "/tmp/${FILE}" || true
            exit 1
          fi
          tar -xzf "/tmp/${FILE}" -C /tmp
          mv "/tmp/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu/mdbook" "$HOME/.local/bin/mdbook"
          chmod +x "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mdbook --version
      - name: Build book
        run: mdbook build

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Windows/MSVC: ring (через reqwest в light-fw-cli) упирается в лимит
      # командной строки D8050 при параллельной сборке.
      - name: Clippy
        env:
          CARGO_BUILD_JOBS: ${{ matrix.os == 'windows-latest' && '1' || 'default' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cargo test --all-features

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        env:
          # ring через reqwest в light-fw-cli: обход лимита D8050.
          CARGO_BUILD_JOBS: "1"
        run: cargo test --all-features -j 2

      - name: Compile benchmarks (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cargo bench --no-run

      - name: Compile benchmarks (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo bench --no-run -j 2

  # Регрессия 0.15.0: примеры не собирались без --all-features (cfg на
  # inspect_state/inject_state + скрытые реэкспорты). Эта сборка ловит
  # повторения: пользовательская зависимость light = "0.15" — это дефолтные
  # фичи, а не all-features.
  build-default:
    name: Build examples (default features)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace without --all-features
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo build --workspace
          cargo build -p example-counter
          cargo build -p example-dashboard
          cargo build -p example-multi-window
          cargo build -p example-devtools-demo
          # Плагин с #[component] (Plugin API, Этап 4): проверяет что кастомный
          # тег `<datepicker>` проходит через compile-time валидацию и
          # регистрируется через linkme.
          cargo build -p example-plugin-demo

  # Feature combinations are checked separately on Linux: they catch code that
  # is valid only with `--all-features` but broken with a reduced feature set.
  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: basic-elements
            args: --no-default-features --features elements-basic
          - name: basic-window-a11y
            args: --no-default-features --features "elements-basic,window,a11y-winit"
          - name: form-window-a11y
            args: --no-default-features --features "elements-form,window,a11y-winit"
          - name: a11y-no-winit
            args: --no-default-features --features "elements-basic,window,a11y"
          - name: full
            args: >-
              --no-default-features
              --features "elements-form,window,a11y-winit,include,align-content,z-order,cursor-theming,offset-position,dynamic-attrs,required-fields,validation,min-max-size"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test feature set
        run: cargo test -p light-fw ${{ matrix.args }}
