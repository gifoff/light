name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cargo test --all-features

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --all-features -j 2

  # Feature combinations are checked separately on Linux: they catch code that
  # is valid only with `--all-features` but broken with a reduced feature set.
  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: basic-elements
            args: --no-default-features --features elements-basic
          - name: basic-window-a11y
            args: --no-default-features --features "elements-basic,window,a11y-winit"
          - name: form-window-a11y
            args: --no-default-features --features "elements-form,window,a11y-winit"
          - name: a11y-no-winit
            args: --no-default-features --features "elements-basic,window,a11y"
          - name: full
            args: >-
              --no-default-features
              --features "elements-form,window,a11y-winit,include,align-content,z-order,cursor-theming,offset-position,dynamic-attrs,required-fields,validation,min-max-size"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test feature set
        run: cargo test -p light ${{ matrix.args }}
