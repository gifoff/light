<window title="Light Calculator" width="340" height="520" resizable="false">
    <titlebar background="#111827" height="34" padding-left="12" padding-right="8" align-items="center">
        <div direction="horizontal" align-items="center" font-color="#F9FAFB" font-size="16">Light Calculator</div>
        <div direction="horizontal" align-items="center" position-x="right">
            <button @click="minimize()" type="button" width="30" height="24" font-size="14" background="#111827" border-color="#111827" font-color="#F9FAFB">−</button>
            <button @click="close()" type="button" width="30" height="24" font-size="14" background="#111827" border-color="#111827" font-color="#F9FAFB">×</button>
        </div>
    </titlebar>
    <div direction="vertical" padding="14" background="#111827" flex-grow="1">
        <!-- Строка результата: добавлен margin-bottom для отделения от кнопок -->
        <div direction="horizontal" align-items="center" justify-content="start" height="60" padding="0" background="#F9FAFB" font-size="30" font-color="#111827" margin-bottom="8" border-radius="4">
            {{ display }}
        </div>

        <!-- Кнопки: фиксированная высота строк height="64", gap для отступов между кнопками -->
        <div direction="horizontal" gap="6" height="64" margin-bottom="6">
            <button @click="digit('7')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">7</button>
            <button @click="digit('8')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">8</button>
            <button @click="digit('9')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">9</button>
            <button @click="op('/')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">÷</button>
        </div>
        <div direction="horizontal" gap="6" height="64" margin-bottom="6">
            <button @click="digit('4')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">4</button>
            <button @click="digit('5')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">5</button>
            <button @click="digit('6')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">6</button>
            <button @click="op('*')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">×</button>
        </div>
        <div direction="horizontal" gap="6" height="64" margin-bottom="6">
            <button @click="digit('1')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">1</button>
            <button @click="digit('2')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">2</button>
            <button @click="digit('3')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">3</button>
            <button @click="op('-')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">−</button>
        </div>
        <div direction="horizontal" gap="6" height="64" margin-bottom="6">
            <button @click="digit('0')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">0</button>
            <button @click="dot" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">.</button>
            <button @click="equals" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">=</button>
            <button @click="op('+')" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">+</button>
        </div>
        <div direction="horizontal" gap="6" height="64">
            <button @click="clear" type="button" flex-grow="1" height="100%" align-items="center" justify-content="center" font-size="20" border-radius="4">C</button>
        </div>
    </div>
</window>
