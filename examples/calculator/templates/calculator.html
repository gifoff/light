<window title="Light Calculator" width="340" height="470" resizable="false">
    <titlebar background="#111827" height="34" padding-left="12" padding-right="8" align-items="center">
        <div direction="horizontal" align-items="center" font-color="#F9FAFB" font-size="16">Light Calculator</div>
        <div direction="horizontal" align-items="center" position-x="right">
            <button @click="minimize()" type="button" width="30" height="24" font-size="14" background="#111827" border-color="#111827" font-color="#F9FAFB">−</button>
            <button @click="close()" type="button" width="30" height="24" font-size="14" background="#111827" border-color="#111827" font-color="#F9FAFB">×</button>
        </div>
    </titlebar>
    <div direction="vertical" padding="14" background="#111827">
        <div background="#F9FAFB" padding="12" font-size="30" font-color="#111827">
            {{ display }}
        </div>
        <div direction="horizontal" flex-grow="1">
            <button @click="digit('7')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">7</button>
            <button @click="digit('8')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">8</button>
            <button @click="digit('9')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">9</button>
            <button @click="op('/')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">÷</button>
        </div>
        <div direction="horizontal" flex-grow="1">
            <button @click="digit('4')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">4</button>
            <button @click="digit('5')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">5</button>
            <button @click="digit('6')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">6</button>
            <button @click="op('*')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">×</button>
        </div>
        <div direction="horizontal" flex-grow="1">
            <button @click="digit('1')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">1</button>
            <button @click="digit('2')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">2</button>
            <button @click="digit('3')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">3</button>
            <button @click="op('-')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">−</button>
        </div>
        <div direction="horizontal" flex-grow="1">
            <button @click="digit('0')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">0</button>
            <button @click="dot" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">.</button>
            <button @click="equals" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">=</button>
            <button @click="op('+')" type="button" width="64" height="100%" flex-grow="1" flex-shrink="0">+</button>
        </div>
        <button @click="clear" type="button">C</button>
    </div>
</window>
