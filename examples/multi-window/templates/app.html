<window title="Окно 1" width="380" height="360" resizable="false">
    <titlebar background="#0F172A" height="34" padding-left="12" padding-right="8" align-items="center">
        <div direction="horizontal" align-items="center" font-color="#F8FAFC" font-size="16">Окно 1</div>
        <div direction="horizontal" align-items="center" position-x="right">
            <button @click="minimize()" type="button" width="30" height="24" font-size="14" background="#0F172A" border-color="#0F172A" font-color="#F8FAFC">-</button>
            <button @click="close()" type="button" width="30" height="24" font-size="14" background="#0F172A" border-color="#0F172A" font-color="#F8FAFC">x</button>
        </div>
    </titlebar>
    <div direction="vertical" padding="18" background="#F8FAFC">
        <div font-size="13" font-color="#64748B">
            Асинхронные обновления адресуются только к этому окну.
        </div>
        <div direction="horizontal" gap="16" align-items="center">
            <div font-size="32" font-color="#0F172A">
                Счёт: {{ count }}
            </div>
        </div>
        <button @click="start_async" type="button" width="100%" height="36" font-size="14" v-if="!loading" background="#2563EB" font-color="#F8FAFC">
            Start Async 3s
        </button>
        <div v-else direction="vertical" align-items="center" gap="6">
            <div font-size="14" font-color="#B45309">Асинхронный цикл выполняется…</div>
            <button @click="cancel_async" type="button" width="100%" height="30" font-size="13" background="#DC2626" font-color="#F8FAFC">
                Отменить
            </button>
        </div>
        <div font-size="12" font-color="#94A3B8" v-if="!loading">
            post_update_to(token, f): асинхронный вызов применяется только
            к окну, чей token передан.
        </div>
    </div>
</window>
