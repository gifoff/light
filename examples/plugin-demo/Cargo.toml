[package]
name = "example-plugin-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Plugin API demo: custom <datepicker> element via #[component]"

[dependencies]
light-fw = { workspace = true }
# Прямая зависимость — `#[component]` разворачивает `#[linkme::distributed_slice]`,
# и крейт-потребитель должен объявлять `linkme` сам (см. doc на макрос).
linkme = "0.3"

# Метаданные плагина для CLI (`light build` / `light check`).
# `provides.elements` — теги, которые регистрируются в `REGISTERED_COMPONENTS`.
[package.metadata.light]
core = "^0.18"

[package.metadata.light.provides]
elements = ["datepicker"]
